<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Calculator  iPhone portrait</title>
  <desc id="desc">Mock of the SwiftUI calculator in iPhone portrait with the standard keypad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="100%" stop-color="#E5E5EA"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="390" height="844" rx="40" fill="url(#bg)"/>
  <rect x="12" y="12" width="366" height="820" rx="32" fill="#F2F2F7"/>

  <!-- Status / nav -->
  <text x="28" y="48" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#1C1C1E" font-weight="600">9:41</text>
  <text x="195" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#1C1C1E" font-weight="600">Calculator</text>
  <text x="28" y="78" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#007AFF">History</text>
  <text x="362" y="78" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#007AFF">Copy</text>

  <!-- Display -->
  <rect x="24" y="108" width="342" height="120" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="350" y="148" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" fill="#8E8E93">12 ×</text>
  <text x="350" y="198" text-anchor="end" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="44" font-weight="600" fill="#1C1C1E">144</text>

  <!-- Keypad helpers -->
  <!-- Rows: AC +/ % ÷ | 7 8 9 × | 4 5 6  | 1 2 3 + | 0 . = -->
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <!-- Row 1 utilities / divide -->
    <rect x="24" y="252" width="78" height="72" rx="14" fill="#AEAEB2"/><text x="63" y="296" fill="#1C1C1E">AC</text>
    <rect x="112" y="252" width="78" height="72" rx="14" fill="#AEAEB2"/><text x="151" y="296" fill="#1C1C1E">+/</text>
    <rect x="200" y="252" width="78" height="72" rx="14" fill="#AEAEB2"/><text x="239" y="296" fill="#1C1C1E">%</text>
    <rect x="288" y="252" width="78" height="72" rx="14" fill="#FF9F0A"/><text x="327" y="296" fill="#FFFFFF">÷</text>

    <!-- Row 2 -->
    <rect x="24" y="336" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="63" y="380" fill="#FFFFFF">7</text>
    <rect x="112" y="336" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="151" y="380" fill="#FFFFFF">8</text>
    <rect x="200" y="336" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="239" y="380" fill="#FFFFFF">9</text>
    <rect x="288" y="336" width="78" height="72" rx="14" fill="#FF9F0A"/><text x="327" y="380" fill="#FFFFFF">×</text>

    <!-- Row 3 -->
    <rect x="24" y="420" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="63" y="464" fill="#FFFFFF">4</text>
    <rect x="112" y="420" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="151" y="464" fill="#FFFFFF">5</text>
    <rect x="200" y="420" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="239" y="464" fill="#FFFFFF">6</text>
    <rect x="288" y="420" width="78" height="72" rx="14" fill="#FF9F0A"/><text x="327" y="464" fill="#FFFFFF"></text>

    <!-- Row 4 -->
    <rect x="24" y="504" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="63" y="548" fill="#FFFFFF">1</text>
    <rect x="112" y="504" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="151" y="548" fill="#FFFFFF">2</text>
    <rect x="200" y="504" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="239" y="548" fill="#FFFFFF">3</text>
    <rect x="288" y="504" width="78" height="72" rx="14" fill="#FF9F0A"/><text x="327" y="548" fill="#FFFFFF">+</text>

    <!-- Row 5 -->
    <rect x="24" y="588" width="166" height="72" rx="14" fill="#3A7BD5"/><text x="107" y="632" fill="#FFFFFF">0</text>
    <rect x="200" y="588" width="78" height="72" rx="14" fill="#3A7BD5"/><text x="239" y="632" fill="#FFFFFF">.</text>
    <rect x="288" y="588" width="78" height="72" rx="14" fill="#FF9F0A"/><text x="327" y="632" fill="#FFFFFF">=</text>
  </g>

  <text x="195" y="710" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8E8E93">Layout mock · replace with a simulator PNG when available</text>
  <rect x="140" y="812" width="110" height="5" rx="2.5" fill="#1C1C1E" opacity="0.25"/>
</svg>
