<svg xmlns="http://www.w3.org/2000/svg" width="844" height="390" viewBox="0 0 844 390" role="img" aria-labelledby="title desc">
  <title id="title">Calculator  iPhone landscape</title>
  <desc id="desc">Mock of the SwiftUI calculator in iPhone landscape with scientific keys.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F2F7"/>
      <stop offset="100%" stop-color="#E5E5EA"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="844" height="390" rx="36" fill="url(#bg)"/>
  <rect x="10" y="10" width="824" height="370" rx="28" fill="#F2F2F7"/>

  <text x="36" y="40" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" fill="#1C1C1E" font-weight="600">9:41</text>
  <text x="422" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" fill="#1C1C1E" font-weight="600">Calculator</text>
  <text x="36" y="40" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#007AFF" transform="translate(0,22)">History</text>
  <text x="808" y="62" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#007AFF">Copy</text>

  <!-- Display (left) -->
  <rect x="24" y="84" width="250" height="270" rx="20" fill="#FFFFFF" filter="url(#soft)"/>
  <text x="258" y="140" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" fill="#8E8E93">(144)</text>
  <text x="258" y="200" text-anchor="end" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#1C1C1E">12</text>
  <text x="149" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Scientific keys appear in landscape</text>

  <!-- Scientific + basic keypad -->
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <!-- Scientific rows (indigo) -->
    <rect x="290" y="84" width="62" height="40" rx="10" fill="#5856D6"/><text x="321" y="109" fill="#FFFFFF"></text>
    <rect x="360" y="84" width="62" height="40" rx="10" fill="#5856D6"/><text x="391" y="109" fill="#FFFFFF">x²</text>
    <rect x="430" y="84" width="62" height="40" rx="10" fill="#5856D6"/><text x="461" y="109" fill="#FFFFFF">1/x</text>
    <rect x="500" y="84" width="62" height="40" rx="10" fill="#5856D6"/><text x="531" y="109" fill="#FFFFFF">x</text>
    <rect x="570" y="84" width="62" height="40" rx="10" fill="#5856D6"/><text x="601" y="109" fill="#FFFFFF">sin</text>
    <rect x="640" y="84" width="62" height="40" rx="10" fill="#5856D6"/><text x="671" y="109" fill="#FFFFFF">cos</text>
    <rect x="710" y="84" width="62" height="40" rx="10" fill="#5856D6"/><text x="741" y="109" fill="#FFFFFF">tan</text>
    <rect x="780" y="84" width="40" height="40" rx="10" fill="#5856D6"/><text x="800" y="109" fill="#FFFFFF">À</text>

    <rect x="290" y="132" width="62" height="40" rx="10" fill="#5856D6"/><text x="321" y="157" fill="#FFFFFF">ln</text>
    <rect x="360" y="132" width="62" height="40" rx="10" fill="#5856D6"/><text x="391" y="157" fill="#FFFFFF">log</text>
    <rect x="430" y="132" width="62" height="40" rx="10" fill="#5856D6"/><text x="461" y="157" fill="#FFFFFF">eã</text>
    <rect x="500" y="132" width="62" height="40" rx="10" fill="#5856D6"/><text x="531" y="157" fill="#FFFFFF">e</text>
    <rect x="570" y="132" width="62" height="40" rx="10" fill="#5856D6"/><text x="601" y="157" fill="#FFFFFF">10ã</text>

    <!-- Basic keypad -->
    <g font-size="18">
      <rect x="290" y="186" width="70" height="48" rx="12" fill="#AEAEB2"/><text x="325" y="216" fill="#1C1C1E">AC</text>
      <rect x="370" y="186" width="70" height="48" rx="12" fill="#AEAEB2"/><text x="405" y="216" fill="#1C1C1E">+/</text>
      <rect x="450" y="186" width="70" height="48" rx="12" fill="#AEAEB2"/><text x="485" y="216" fill="#1C1C1E">%</text>
      <rect x="530" y="186" width="70" height="48" rx="12" fill="#FF9F0A"/><text x="565" y="216" fill="#FFFFFF">÷</text>
      <rect x="610" y="186" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="645" y="216" fill="#FFFFFF">7</text>
      <rect x="690" y="186" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="725" y="216" fill="#FFFFFF">8</text>
      <rect x="770" y="186" width="50" height="48" rx="12" fill="#3A7BD5"/><text x="795" y="216" fill="#FFFFFF">9</text>

      <rect x="290" y="244" width="70" height="48" rx="12" fill="#FF9F0A"/><text x="325" y="274" fill="#FFFFFF">×</text>
      <rect x="370" y="244" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="405" y="274" fill="#FFFFFF">4</text>
      <rect x="450" y="244" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="485" y="274" fill="#FFFFFF">5</text>
      <rect x="530" y="244" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="565" y="274" fill="#FFFFFF">6</text>
      <rect x="610" y="244" width="70" height="48" rx="12" fill="#FF9F0A"/><text x="645" y="274" fill="#FFFFFF"></text>
      <rect x="690" y="244" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="725" y="274" fill="#FFFFFF">1</text>
      <rect x="770" y="244" width="50" height="48" rx="12" fill="#3A7BD5"/><text x="795" y="274" fill="#FFFFFF">2</text>

      <rect x="290" y="302" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="325" y="332" fill="#FFFFFF">3</text>
      <rect x="370" y="302" width="70" height="48" rx="12" fill="#FF9F0A"/><text x="405" y="332" fill="#FFFFFF">+</text>
      <rect x="450" y="302" width="150" height="48" rx="12" fill="#3A7BD5"/><text x="525" y="332" fill="#FFFFFF">0</text>
      <rect x="610" y="302" width="70" height="48" rx="12" fill="#3A7BD5"/><text x="645" y="332" fill="#FFFFFF">.</text>
      <rect x="690" y="302" width="130" height="48" rx="12" fill="#FF9F0A"/><text x="755" y="332" fill="#FFFFFF">=</text>
    </g>
  </g>
</svg>
