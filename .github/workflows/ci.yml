name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # Pin macos-26: newest stable GitHub image with Xcode 26.6 / iOS 26.5 SDK.
    # Xcode 27 is only a public preview on runners as of Oct 2026, so stay on 26.x.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an iOS simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-26")) | .value[]
             | select(.name | test("iPhone"))] | last | .udid // empty')
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl list devices available --json | jq -r '
              [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
               | select(.name | test("iPhone"))] | last | .udid // empty')
          fi
          if [ -z "$udid" ]; then echo "No iOS simulator available" >&2; exit 1; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict
